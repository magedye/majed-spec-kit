schema_version: "1.0"

extension:
  id: majed-governance
  name: "Majed Governance and Assurance"
  version: "1.1.0"
  description: "Deterministic, read-only governance checks for requirement traceability, evidence freshness, authorization status, reviewer independence, control coverage, and unsupported completion claims."
  category: "process"
  effect: "read-write"
  author: "Majed Spec Kit"
  repository: "https://github.com/magedye/majed-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.3.0"

provides:
  commands:
    - name: "speckit.majed-governance.check"
      file: "commands/speckit.majed-governance.check.md"
      description: "Validate a governance record and report unsupported completion, stale evidence, authorization, review, and control findings"
    - name: "speckit.majed-governance.trace"
      file: "commands/speckit.majed-governance.trace.md"
      description: "Render a derived, non-authoritative requirement-to-evidence traceability view"
    - name: "speckit.majed-governance.decide"
      file: "commands/speckit.majed-governance.decide.md"
      description: "Prepare an owner decision brief without granting acceptance or release authority"
    - name: "speckit.majed-governance.intake"
      file: "commands/speckit.majed-governance.intake.md"
      description: "Extract traceable candidate obligations from a request document"
    - name: "speckit.majed-governance.impact"
      file: "commands/speckit.majed-governance.impact.md"
      description: "Map changed files to components and require rollback for risky changes"
    - name: "speckit.majed-governance.converge"
      file: "commands/speckit.majed-governance.converge.md"
      description: "Produce a bounded remediation plan for open requirements"
    - name: "speckit.majed-governance.sources"
      file: "commands/speckit.majed-governance.sources.md"
      description: "Validate source authority, revision, and content hashes"
    - name: "speckit.majed-governance.metrics"
      file: "commands/speckit.majed-governance.metrics.md"
      description: "Report deterministic governance record metrics"

  templates:
    - name: "governance-record"
      file: "templates/governance-record.json"
      description: "Project-owned governance record template"
    - name: "governance-record-schema"
      file: "schemas/governance-record.schema.json"
      description: "JSON Schema for the governance record"
    - name: "impact-map"
      file: "templates/impact-map.json"
      description: "Path-prefix impact map for changed-file analysis"
    - name: "sources-manifest"
      file: "templates/sources-manifest.json"
      description: "Source authority/revision/hash manifest"

  scripts:
    - name: "governance-core"
      file: "scripts/python/governance_core.py"
      description: "Stdlib-only governance record validator and derived-view renderer"
      runtimes: ["python"]
    - name: "workflow-bridge"
      file: "scripts/python/workflow_bridge.py"
      description: "Workflow preflight, evidence recording, and acceptance-boundary bridge"
      runtimes: ["python"]

tags:
  - "governance"
  - "assurance"
  - "traceability"
  - "evidence"
  - "review"
