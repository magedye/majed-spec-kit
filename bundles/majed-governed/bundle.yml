schema_version: "1.0"

bundle:
  id: "majed-governed"
  name: "Majed Governed Core"
  version: "1.0.0"
  role: "developer"
  description: "Extension-first Majed Core: ADEQ decision-quality preset, governance/assurance extension, and controlled Spec Kit workflow."
  author: "Majed Spec Kit"
  license: "MIT"

requires:
  speckit_version: ">=1.3.0"
  tools: []
  mcp: []

provides:
  extensions:
    - id: "majed-governance"
      version: "1.0.0"
  presets:
    - id: "majed-adeq"
      version: "1.0.0"
      priority: 5
      strategy: "append"
  workflows:
    - id: "majed-controlled"
      version: "1.0.0"

tags:
  - "majed"
  - "governance"
  - "adeq"
  - "workflow"
